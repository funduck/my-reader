# Shared analyzer config for every package in the app/ workspace.
# Packages pick it up automatically (the analyzer walks up to the nearest
# analysis_options.yaml). Requires very_good_analysis in dev_dependencies
# of app/pubspec.yaml (workspace root).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"
  errors:
    # Agents must not leave these behind: treat as hard errors.
    missing_required_param: error
    missing_return: error
    unawaited_futures: error
    discarded_futures: error
    avoid_dynamic_calls: error
    unused_import: error
    dead_code: error
    todo: ignore

linter:
  rules:
    # Explicit types on public API; inference elsewhere.
    always_specify_types: false
    # Packages use relative imports inside lib/, package: across packages.
    always_use_package_imports: false
    prefer_relative_imports: true
    # Enabled here so the severities above apply even if the preset drops them.
    discarded_futures: true
    unawaited_futures: true
    avoid_dynamic_calls: true
