name: my_reader_workspace
description: My reader app monorepo (pub workspace root).
publish_to: none
environment:
  sdk: ^3.14.0
workspace:
  - app
  - packages/core
  - packages/core_testing
  - packages/features/common
  - packages/features/history
  - packages/features/library
  - packages/features/lookup_sheet
  - packages/features/settings
  - packages/packs_http
  - packages/format_epub
  - packages/lookup_wiktionary
  - packages/levels_cefr
  - packages/lookup_stardict
  - packages/reader_api
  - packages/reader_simple
  - packages/storage_drift
  - packages/text_en
dev_dependencies:
  # tool/check_imports.dart and its tests
  test: ^1.25.0
  very_good_analysis: ^11.0.0
  yaml: ^3.1.0
# package:sqlite3 links the OS libsqlite3 instead of downloading a prebuilt one
# from github.com (blocked in the agent sandbox). See docs/tasks/README.md.
hooks:
  user_defines:
    sqlite3:
      source: system
