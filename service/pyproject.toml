[project]
name = "my-reader-service"
version = "0.1.0"
description = "Сборка и раздача пакетов данных для My reader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
